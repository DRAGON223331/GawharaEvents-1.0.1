name: Build GawharaEvents

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build GawharaEvents JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Find and verify JAR
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          echo "Files produced in target/:"
          ls -lah target/

          JAR_FILE="$(find target -maxdepth 1 -type f -name 'GawharaEvents-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$JAR_FILE" ]]; then
            echo "ERROR: No GawharaEvents JAR found in target/"
            exit 1
          fi

          echo "JAR found: $JAR_FILE"
          jar tf "$JAR_FILE" | grep -qx 'plugin.yml'
          jar tf "$JAR_FILE" | grep -qx 'com/gawharasmp/events/GawharaEvents.class'
          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: GawharaEvents-JAR
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
